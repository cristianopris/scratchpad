<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>US Stock Market Heatmap</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #131722;
            color: #d1d4dc;
            overflow-x: hidden;
        }

        .header {
            background-color: #1e222d;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #2962ff;
        }

        .header p {
            font-size: 12px;
            color: #787b86;
            margin-top: 5px;
        }

        .container {
            width: 100%;
            height: calc(100vh - 70px);
            padding: 0;
        }

        .tradingview-widget-container {
            width: 100%;
            height: 100%;
        }

        #tradingview_widget {
            width: 100%;
            height: 100%;
        }

        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #1e222d;
            padding: 8px;
            text-align: center;
            font-size: 10px;
            color: #787b86;
            border-top: 1px solid #2a2e39;
        }

        .footer a {
            color: #2962ff;
            text-decoration: none;
        }

        /* Loading spinner */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .spinner {
            border: 4px solid #2a2e39;
            border-top: 4px solid #2962ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 US Stock Market Heatmap</h1>
        <p>Real-time market overview</p>
    </div>

    <div class="container">
        <div class="tradingview-widget-container">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading heatmap...</p>
            </div>
            <div id="tradingview_widget"></div>
        </div>
    </div>

    <div class="footer">
        Powered by <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
    {
        "exchanges": [
            "US"
        ],
        "dataSource": "SPX500",
        "grouping": "sector",
        "blockSize": "market_cap_basic",
        "blockColor": "change",
        "locale": "en",
        "symbolUrl": "",
        "colorTheme": "dark",
        "hasTopBar": true,
        "isDataSetEnabled": true,
        "isZoomEnabled": true,
        "hasSymbolTooltip": true,
        "width": "100%",
        "height": "100%"
    }
    </script>
</body>
</html>
